[project]
name = "balatro-terminal"
version = "0.1.0"
description = "Balatro 的终端复刻版本（CLI + TUI）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
]

[project.scripts]
cli = "balatro_cli.cli.__main__:main"
tui = "balatro_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balatro_cli", "balatro_tui"]
